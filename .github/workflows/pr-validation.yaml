name: PR Validation Workflow

on:
  pull_request:
    branches:
      - develop

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Choose the Node.js version

      - name: Install dependencies
        run: npm install

      - name: Lint HTML files
        run: npx htmlhint src/**/*.html

      - name: Lint CSS files
        run: npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build static website using Parcel
        run: npx parcel build src/index.html --out-dir dist --no-source-maps
